# Builds the Android app on GitHub's own servers every time you upload changes (or press "Run workflow").
# The finished APK appears under Actions → the latest run → Artifacts → "UZ-Auto-Life-APK".
name: APK yigʻish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UZ_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Imzo kaliti (agar Secrets'da boʻlsa)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.UZ_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/uz.keystore" && echo "UZ_KEYSTORE_FILE=$RUNNER_TEMP/uz.keystore" >> "$GITHUB_ENV"

      - name: APK yigʻish
        env:
          UZ_KEYSTORE_PASSWORD: ${{ secrets.UZ_KEYSTORE_PASSWORD }}
          UZ_KEY_ALIAS: ${{ secrets.UZ_KEY_ALIAS }}
          UZ_KEY_PASSWORD: ${{ secrets.UZ_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: UZ-Auto-Life-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
